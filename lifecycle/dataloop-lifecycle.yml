  policy_published: true
  sunset_header: false
  deprecation_header: false
  style: >-
    A central Deprecations page tracks features, settings and services that have
    been or are scheduled to be deprecated, with the SDK version at which each
    became deprecated and the version at which it became non-functional. No RFC
    8594 Sunset/Deprecation HTTP headers are advertised.
  examples:
  - item: '`4ptBox` project setting'
    reason: excessive API calls during annotation, latency in the SDK
    status: removed from SDK and global settings
  - item: Attributes 1.0 (list-based attributes)
    deprecated_from_sdk: 1.99.0
    non_functional_from_sdk: 1.90.39
    migration: migrate to dict-based Attributes 2.0; use update_attributes()
  - item: '`use_attributes_2()` function'
    deprecated_from_sdk: 1.99.0
    non_functional_from_sdk: 1.90.39
  - item: Key Frames counted as Data Points in billing
    status: no longer counted
