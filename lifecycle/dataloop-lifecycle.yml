versioning:
  scheme: uri-path
  current: v1
  base: https://gate.dataloop.ai/api/v1
  note: >-
    The platform REST API is pinned at /api/v1 and Dataloop publishes no API
    version policy document. Practical versioning is carried by the Python SDK
    (dtlpy), which is versioned semantically and whose release notes are where
    breaking changes are announced.
  sdk_versioning:
    package: dtlpy
    current: 1.124.2
    scheme: semver
    release_notes: https://docs.dataloop.ai/docs/sdk-release-notes
