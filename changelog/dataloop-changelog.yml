- date: '2026-07-27'
  theme: Infrastructure freedom — hybrid and first full on-premises deployment
  breaking: false
  additions:
  - DDOE On-Premises Installer (first release) — full platform deployable in a customer data center
  - Expanded hybrid setup — connect a self-managed Kubernetes cluster and run FaaS apps, pipelines and preprocessing on it
  - Preprocesses Management tab — unified view/pause/resume of preprocesses at system, org and project level
  - Organization Bots — auto-created org bot added to every project for org-scoped preprocesses
  - System Projects — auto-created per organization as the control point for org-level functions
  - Redesigned dataset creation flow covering on-prem and cluster-connected storage
  - Project Recipe — project-level labels/attributes/annotation settings as the single source of truth
  - Ask Donna — built-in AI assistant in the platform interface
  removals:
  - Manual bot creation is no longer available
- date: '2026-03-30'
  theme: Rebrand to Dell Data Orchestration Engine (DDOE)
  breaking: false
  additions:
  - Platform renamed Dell Data Orchestration Engine (DDOE); UI updated with Dell name, logo and look and feel
  - New Item Details panel with built-in file preview
  - DDOE Hub "Getting Started" tab with curated ready-to-use solutions
  - GenAI Evaluation Studio and multimodal recipes
  - Tasks management and recipe creation updates
