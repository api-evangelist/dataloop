aid: dataloop
name: DataLoop
description: 'Dataloop is an enterprise AI data platform for the full unstructured-data
  lifecycle — ingesting images, video, audio, text and LiDAR from cloud or on-premises
  storage, labeling and reviewing it through managed annotation tasks and recipes,
  orchestrating it with pipelines and serverless functions (FaaS), and turning it into
  governed, model-ready datasets. The platform is programmable end to end: a JWT-authenticated
  REST API at gate.dataloop.ai/api/v1, a first-party Python SDK and `dlp` CLI (dtlpy),
  a JavaScript SDK, and a Vue component library for building in-platform applications.
  Founded in Israel in 2017, Dataloop was acquired by Dell Technologies in December
  2025 and the platform is now marketed as the Dell Data Orchestration Engine (DDOE).'
url: https://raw.githubusercontent.com/api-evangelist/dataloop/refs/heads/main/apis.yml
