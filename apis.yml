apis:
- aid: dataloop:platform-api
  name: Dataloop Platform API
  description: 'The Dataloop (Dell Data Orchestration Engine) platform REST API. Every
    part of the platform — projects, datasets, items, annotations, recipes and ontologies,
    tasks and assignments, packages, services, triggers, executions and pipelines —
    can be created, read, updated and deleted over HTTP. Requests are authenticated
    with a JSON Web Token supplied as an Authorization bearer token, obtained either
    from a platform API key or from the /token endpoint. Dataloop does not publish a
    public OpenAPI definition; the interactive Swagger UI at gate.dataloop.ai/api/v1/docs/
    requires an authenticated browser session.'
